name: turskyi
description: Personal web page of Dmytro Turskyi.

# The following line prevents the package from being accidentally published to
# pub.dev using `pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev
homepage: https://turskyi.com

version: 1.2.5

environment:
  sdk: '>=3.9.2 <4.0.0'

dependencies:
  dio: ^5.11.1
  email_validator: ^3.0.0
  flutter:
    sdk: flutter

  flutter_svg: ^2.3.2

  #  localization
  flutter_translate:
    git:
      url: https://github.com/Javernaver/flutter_translate.git
      ref: master

  intl: ^0.20.3
  json_annotation: ^4.12.0
  mockito: ^5.8.1

  # Add `ChangeNotifierProvider` and `Consumer` for implementing the MVP
  # structural design pattern.
  provider: ^6.1.5+1

  retrofit: ^4.10.0
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.3

dependency_overrides:
  meta: ^1.19.0

dev_dependencies:
  build_runner: any
  # The set of rules follows the Effective Dart: Style Guide.
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  json_serializable: ^6.15.2
  retrofit_generator: ^10.3.3

# The following section is specific to Flutter.
flutter:

  # The following line ensures that the Material Icons' font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # assets of the application
  assets:
    #    strings
    - assets/i18n/
    #    picture files
    - assets/images/
    - assets/images/feature_graphics/


